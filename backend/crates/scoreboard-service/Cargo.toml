[package]
name = "scoreboard-service"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { version = "0.5.3", features = ["std"] }
axum = "0.8.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["macros", "postgres", "runtime-tokio", "uuid", "chrono"] }
tokio = { version = "1.52.3", features = ["full"] }
uuid = { version = "1.23.2", features = ["v4", "serde"] }
shared = { path = "../shared" }
dotenvy = "0.15.7"
chrono = { version = "0.4.45", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
