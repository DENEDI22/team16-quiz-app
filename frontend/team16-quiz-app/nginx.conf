map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA-Fallback: unbekannte Pfade an Angular-Router weiterreichen.
    # /api/* wird nie hier ankommen — das routet der Ingress vor nginx.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location = /api/auth {
        proxy_pass http://auth-service:3000/;
    }

    location /api/auth/ {
        proxy_pass http://auth-service:3000/;
    }

    location = /api/singleplayer {
        proxy_pass http://singleplayer-service:3000/;
    }

    location /api/singleplayer/ {
        proxy_pass http://singleplayer-service:3000/;
    }

    location = /api/multiplayer {
        proxy_pass http://multiplayer-service:3000/;
    }

    location /api/multiplayer/ {
        proxy_pass http://multiplayer-service:3000/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
