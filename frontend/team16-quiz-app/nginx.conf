server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA-Fallback: unbekannte Pfade an Angular-Router weiterreichen.
    # /api/* wird nie hier ankommen — das routet der Ingress vor nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
