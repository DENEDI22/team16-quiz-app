<main class="setup-page">

  <a class="logo-link" routerLink="/">
    <img
      src="/assets/images/quiz-logo-clean.png"
      alt="Team16 Quiz Logo"
    />
  </a>

  <section class="setup-card">

    <h1>Quiz vorbereiten</h1>

    <mat-form-field appearance="outline">
      <mat-label>Kategorien</mat-label>

      <mat-select [(ngModel)]="categories" multiple>

        <mat-option
          value="All"
          (click)="toggleAllCategories()"
        >
          Alle
        </mat-option>

        <mat-option value="Sports">Sport</mat-option>
        <mat-option value="History">Geschichte</mat-option>
        <mat-option value="Geography">Geografie</mat-option>
        <mat-option value="Entertainment: Music">Musik</mat-option>
        <mat-option value="Science: Computers">Computer</mat-option>
        <mat-option value="Entertainment: Video Games">Videospiele</mat-option>
        <mat-option value="General Knowledge">Allgemeinwissen</mat-option>

      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Schwierigkeit</mat-label>

      <mat-select [(ngModel)]="difficulty">

        <mat-option value="easy">
          Einfach
        </mat-option>

        <mat-option value="medium">
          Mittel
        </mat-option>

        <mat-option value="hard">
          Schwer
        </mat-option>

      </mat-select>

    </mat-form-field>

    <button
      class="start-button"
      mat-raised-button
      color="primary"
      [disabled]="categories.length === 0 || !difficulty"
      (click)="startQuiz()"
    >
      Quiz starten
    </button>

  </section>

</main>
