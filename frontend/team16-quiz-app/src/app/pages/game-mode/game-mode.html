<main class="mode-page">
  <a class="logo-link" routerLink="/">
    <img
      src="/assets/images/quiz-logo-clean.png"
      alt="Team16 Quiz Logo"
    />
  </a>
  <section class="mode-container">


    <h1>Spielmodus wählen</h1>

    <p class="subtitle">
      Entscheide, wie du spielen möchtest.
    </p>

    <div class="mode-cards">

      <a class="mode-card" routerLink="/quiz-setup">
        <h2>Singleplayer</h2>

        <p>
          Spiele alleine und teste dein Wissen.
        </p>

        <span>Jetzt starten →</span>
      </a>

      <a class="mode-card" routerLink="/multiplayer">

        <h2>Multiplayer</h2>

        <p>
          Spiele gegen andere Spieler.
        </p>

        <span>Lobby finden →</span>

      </a>

    </div>

  </section>
</main>
