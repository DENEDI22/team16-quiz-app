services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Start123!
      POSTGRES_DB: default_database
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ./backend/
      dockerfile: ./crates/auth-service/dockerfile
    environment:
      DATABASE_URL: postgres://admin:Start123!@postgres:5432/quiz-auth
      JWT_SECRET: dev-only-secret
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  quiz-service:
    build:
      context: ./backend/
      dockerfile: ./crates/quiz-service/dockerfile
    environment:
      DATABASE_URL: postgres://admin:Start123!@postgres:5432/quiz-service
      CRON_JOB: "0 0 * * * *"
      ADDRESS: "0.0.0.0:3000"
      JWT_SECRET: dev-only-secret
    ports:
      - "4000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  scoreboard-service:
    build:
      context: ./backend/
      dockerfile: ./crates/scoreboard-service/dockerfile
    environment:
      DATABASE_URL: postgres://admin:Start123!@postgres:5432/scoreboard-service
      JWT_SECRET: dev-only-secret
    ports:
      - "5000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  singleplayer-service:
    build:
      context: ./backend/
      dockerfile: ./crates/singleplayer-service/dockerfile
    environment:
      ADDRESS: "0.0.0.0:3000"
      JWT_SECRET: dev-only-secret
      QUIZ_SERVICE_URL: "http://quiz-service:3000"
      SCOREBOARD_SERVICE_URL: "http://scoreboard-service:3000"
    ports:
      - "7000:3000"
    depends_on:
      quiz-service:
        condition: service_started
      scoreboard-service:
        condition: service_started

  multiplayer-service:
    build:
      context: ./backend/
      dockerfile: ./crates/multiplayer-service/dockerfile
    environment:
      ADDRESS: "0.0.0.0:3000"
      JWT_SECRET: dev-only-secret
      REDIS_URL: "redis://redis:6379"
      QUIZ_SERVICE_URL: "http://quiz-service:3000"
      SCOREBOARD_SERVICE_URL: "http://scoreboard-service:3000"
    ports:
      - "7001:3000"
    depends_on:
      redis:
        condition: service_healthy
      quiz-service:
        condition: service_started
      scoreboard-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend/team16-quiz-app/
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      auth-service:
        condition: service_started
      singleplayer-service:
        condition: service_started
      multiplayer-service:
        condition: service_started

volumes:
  pgdata:
