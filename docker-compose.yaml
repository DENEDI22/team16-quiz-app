services:
  db-quiz-app:
    image: "postgres:latest"
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Start123!
      POSTGRES_DB: default_database
    volumes:
      - ./db-data/:/var/lib/postgresql/

  redis:
    image: "redis:7-alpine"
    ports:
      - 6379:6379

  auth:
    build:
      context: ./backend/
      dockerfile: ./crates/auth-service/dockerfile
    environment:
      DATABASE_URL: postgres://admin:Start123!@db-quiz-app:5432/quiz-auth
      JWT_SECRET: dev-only-secret
    ports:
      - "3000:3000"
    depends_on:
      - db-quiz-app

  quiz-service:
    build:
      context: ./backend/
      dockerfile: ./crates/quiz-service/dockerfile
    environment:
      DATABASE_URL: postgres://admin:Start123!@db-quiz-app:5432/quiz-service
      CRON_JOB: "0 0 * * * *"
      ADDRESS: "0.0.0.0:3000"
      JWT_SECRET: dev-only-secret
    ports:
      - "4000:3000"
    depends_on:
      - db-quiz-app

  scoreboard-service:
    build:
      context: ./backend/
      dockerfile: ./crates/scoreboard-service/dockerfile
    environment:
      DATABASE_URL: postgres://admin:Start123!@db-quiz-app:5432/scoreboard-service
      JWT_SECRET: dev-only-secret
      AUTH_SERVICE_URL: "http://auth:3000"
    ports:
      - "5000:3000"
    depends_on:
      - db-quiz-app

  singleplayer-service:
    build:
      context: ./backend/
      dockerfile: ./crates/singleplayer-service/dockerfile
    environment:
      ADDRESS: "0.0.0.0:3000"
      JWT_SECRET: dev-only-secret
      QUIZ_SERVICE_URL: "http://quiz-service:3000"
      SCOREBOARD_SERVICE_URL: "http://scoreboard-service:3000"
    ports:
      - "7000:3000"
    depends_on:
      - quiz-service

  multiplayer-service:
    build:
      context: ./backend/
      dockerfile: ./crates/multiplayer-service/dockerfile
    environment:
      ADDRESS: "0.0.0.0:3000"
      JWT_SECRET: dev-only-secret
      REDIS_URL: "redis://redis:6379"
      QUIZ_SERVICE_URL: "http://quiz-service:3000"
      SCOREBOARD_SERVICE_URL: "http://scoreboard-service:3000"
    ports:
      - "7001:3000"
    depends_on:
      - redis
      - quiz-service

volumes:
  pgdata:
