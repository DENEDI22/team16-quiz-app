apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: quiz-app

resources:
  - namespace.yaml
  - secrets.yaml
  - postgres.yaml
  - redis.yaml
  - auth-service.yaml
  - quiz-service.yaml
  - scoreboard-service.yaml
  - singleplayer-service.yaml
  - multiplayer-service.yaml
  - frontend.yaml
  - ingress.yaml
  - ngrok.yaml

# Zentrale Stelle für Image-Namen/-Tags. newName an den Docker-Hub-Account
# anpassen (CI pusht als <DOCKERHUB_USERNAME>/quiz-app-<service>).
# Für lokales Üben mit k3d stattdessen lokal bauen und importieren —
# siehe docs/k3s-local-cluster-guide.md.
images:
  - name: quiz-app-auth-service
    newName: docker.io/denedi22/quiz-app-auth-service
    newTag: latest
  - name: quiz-app-quiz-service
    newName: docker.io/denedi22/quiz-app-quiz-service
    newTag: latest
  - name: quiz-app-scoreboard-service
    newName: docker.io/denedi22/quiz-app-scoreboard-service
    newTag: latest
  - name: quiz-app-singleplayer-service
    newName: docker.io/denedi22/quiz-app-singleplayer-service
    newTag: latest
  - name: quiz-app-multiplayer-service
    newName: docker.io/denedi22/quiz-app-multiplayer-service
    newTag: latest
  - name: quiz-app-frontend
    newName: docker.io/denedi22/quiz-app-frontend
    newTag: latest
