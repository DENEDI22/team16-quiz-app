apiVersion: v1
kind: ServiceAccount
metadata:
  name: auto-updater
  namespace: quiz-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: auto-updater
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: auto-updater
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: auto-updater
subjects:
  - kind: ServiceAccount
    name: auto-updater
    namespace: quiz-app
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: auto-updater
  namespace: quiz-app
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: auto-updater
          nodeSelector:
            kubernetes.io/hostname: pi1
          restartPolicy: OnFailure
          containers:
            - name: kubectl
              image: bitnami/kubectl:latest
              command:
                - /bin/sh
                - -c
                - |
                  for deploy in auth-service quiz-service scoreboard-service singleplayer-service multiplayer-service frontend; do
                    kubectl rollout restart deployment/$deploy -n quiz-app
                  done
