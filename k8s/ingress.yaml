# Single Point of Access: Traefik (in k3s eingebauter Ingress-Controller)
# routet alles unter einer Adresse. ngrok zeigt nur auf Port 80 des Clusters.
#
#   /api/auth/*          -> auth-service:3000          (Prefix wird entfernt)
#   /api/singleplayer/*  -> singleplayer-service:3000  (Prefix wird entfernt)
#   /api/multiplayer/*   -> multiplayer-service:3000   (Prefix wird entfernt)
#   /api/scoreboard/*    -> scoreboard-service:3000    (Prefix wird entfernt)
#   /*                   -> frontend:80 (nginx, SPA)
#
# Die Backends kennen die /api/*-Prefixe nicht — die stripPrefix-Middleware
# entfernt sie, sodass z.B. /api/auth/login als /login ankommt.
# WebSockets (/ws, /duels/{id}/ws) funktionieren durch Traefik ohne Extra-Konfig.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-prefix
  namespace: quiz-app
spec:
  stripPrefix:
    prefixes:
      - /api/auth
      - /api/singleplayer
      - /api/multiplayer
      - /api/scoreboard
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quiz-app-api
  namespace: quiz-app
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: quiz-app-strip-api-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 3000
          - path: /api/singleplayer
            pathType: Prefix
            backend:
              service:
                name: singleplayer-service
                port:
                  number: 3000
          - path: /api/multiplayer
            pathType: Prefix
            backend:
              service:
                name: multiplayer-service
                port:
                  number: 3000
          - path: /api/scoreboard
            pathType: Prefix
            backend:
              service:
                name: scoreboard-service
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quiz-app-web
  namespace: quiz-app
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
