apiVersion: apps/v1
kind: Deployment
metadata:
  name: singleplayer-service
  namespace: quiz-app
spec:
  replicas: 4
  selector:
    matchLabels:
      app: singleplayer-service
  template:
    metadata:
      labels:
        app: singleplayer-service
    spec:
      containers:
        - name: singleplayer-service
          image: quiz-app-singleplayer-service
          ports:
            - containerPort: 3000
          env:
            - name: ADDRESS
              value: 0.0.0.0:3000
            - name: QUIZ_SERVICE_URL
              value: http://quiz-service:3000
            - name: SCOREBOARD_SERVICE_URL
              value: http://scoreboard-service:3000
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: quiz-app-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: singleplayer-service
  namespace: quiz-app
spec:
  selector:
    app: singleplayer-service
  ports:
    - port: 3000
